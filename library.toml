# Marks this repository as a parts library: parts other people design, make and
# sell, which we only record. A machine mounts it under modules/ like any other
# external DOQS project, and skips it in its own gates because of this file, not
# because of where it sits. See doqs/docs/parts-library.md.
#
# `name` is the first part of a part reference: stoq:hiwin/hgr-rail#HGR20R500.
# It must match the folder a machine mounts this repository at, which is what
# the reference actually resolves against.
schema = "doqs-library-v1"
name = "stoq"
description = "Components from third-party suppliers, recorded once and read by every Refaqt project."
