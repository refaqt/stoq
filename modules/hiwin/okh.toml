okhv = "OKH-LOSHv1.0"
name = "HIWIN"
repo = "https://github.com/refaqt/stoq/tree/main/modules/hiwin"
version = "0.1.0"
license = "CC-BY-SA-4.0"
licensor = "REFAQT"
function = "Profile rail linear guideways from HIWIN."

# The name on the part, not the supplier we buy from. The files here were
# generated by the HIWIN GmbH product configurator (CADClick), which is why the
# German entity and its terms are the ones recorded.
[brand]
name = "HIWIN GmbH"
website = "https://www.hiwin.de"
cad-terms = "https://www.hiwin.de/en/agb"
# Was true from 2026-09-21. Set false on 2026-10-02: the HIWIN terms do not
# allow sharing. See docs/decisions/2026-10-02_hiwin-stop-sharing.md.
# Set true again on 2026-10-06: we share the files until HIWIN objects. See
# docs/decisions/2026-10-06_share-supplier-files-until-asked.md.
redistribute = true

# The 2026-09-21 decision, recorded in the form the component method asks for.
# See docs/adding-components.md. No dated copy of the terms page was saved at
# the time, so `evidence` is empty. Save one in stoq-private and add a new
# entry that names it; never edit these.
[[terms-review]]
kind = "cad"
decision = "public"
basis = "terms"
source = "https://www.hiwin.de/en/agb"
reviewer = "Niels Bosmans"
reviewed = 2026-09-21

[[terms-review]]
kind = "documentation"
decision = "public"
basis = "terms"
source = "https://www.hiwin.de/en/agb"
reviewer = "Niels Bosmans"
reviewed = 2026-09-21

# 2026-10-02: the terms were read and saved. Clause 2.4 of the HIWIN terms
# says drawings and other documents "may not be made accessible to third
# parties". The catalogue says reproduction needs HIWIN's permission. These
# entries replace the two above; the newest entry for each kind counts.
[[terms-review]]
kind = "cad"
decision = "internal"
basis = "terms"
source = "https://www.hiwin.de/en/agb"
evidence = "evidence/hiwin/2026-10-02_agb.pdf"
reviewer = "Niels Bosmans"
reviewed = 2026-10-02

[[terms-review]]
kind = "documentation"
decision = "internal"
basis = "terms"
source = "https://www.hiwin.de/en/agb"
evidence = "evidence/hiwin/2026-10-02_agb.pdf"
reviewer = "Niels Bosmans"
reviewed = 2026-10-02

# 2026-10-06: share the files again, until HIWIN asks us to stop. The terms
# have not changed: nothing written allows sharing, so basis = "none" and the
# check shows a warning. If HIWIN objects, add an `internal` entry again and
# move the files back to stoq-private. See
# docs/decisions/2026-10-06_share-supplier-files-until-asked.md.
[[terms-review]]
kind = "cad"
decision = "public"
basis = "none"
source = "https://www.hiwin.de/en/agb"
evidence = "evidence/hiwin/2026-10-02_agb.pdf"
reviewer = "Niels Bosmans"
reviewed = 2026-10-06

[[terms-review]]
kind = "documentation"
decision = "public"
basis = "none"
source = "https://www.hiwin.de/en/agb"
evidence = "evidence/hiwin/2026-10-02_agb.pdf"
reviewer = "Niels Bosmans"
reviewed = 2026-10-06
